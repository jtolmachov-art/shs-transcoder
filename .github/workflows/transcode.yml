# South House Studio - Clients Zone: light 720p copies of uploaded videos + a thumbnail from the middle.
# Every 5 minutes this asks files.southhouse.studio for videos waiting in the queue. No passwords or keys:
# the site recognises this run by the identity token GitHub gives it. Links are hidden in the logs.
name: Light copy
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  id-token: write   # identity token for files.southhouse.studio
  contents: write   # only to keep the schedule alive (a tiny commit once a month)
concurrency:
  group: light-copy
  cancel-in-progress: false
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Make 720p copies
        env:
          SITE: https://files.southhouse.studio
        run: |
          set -uo pipefail
          START=$(date +%s)
          idtoken() { curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=shs-files" | jq -r .value; }
          INSTALLED=0
          while [ $(( $(date +%s) - START )) -lt 16200 ]; do
            T=$(idtoken); echo "::add-mask::$T"
            CODE=$(curl -s -o job.json -w '%{http_code}' -H "Authorization: Bearer $T" "$SITE/api/job/next")
            if [ "$CODE" != 200 ]; then echo "Queue empty ($CODE)"; break; fi
            BASE=$(jq -r .base job.json); Q=$(jq -r .q job.json); NAME=$(jq -r .name job.json)
            echo "::add-mask::$Q"; echo "::add-mask::$BASE"
            if [ "$INSTALLED" = 0 ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; INSTALLED=1; fi
            echo "=== $NAME"
            if ! BASE="$BASE" Q="$Q" bash -euo pipefail -c '
              SRC="$BASE/src?$Q"
              NET="-reconnect 1 -reconnect_streamed 1 -reconnect_on_network_error 1 -reconnect_delay_max 30"
              IFS=, read -r W H < <(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$SRC")
              DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$SRC" || echo 0)
              echo "Source ${W}x${H}, ${DUR}s"
              rm -f lite.mp4 thumb.jpg part_*
              ffmpeg -hide_banner -loglevel warning -stats $NET -i "$SRC" -map 0:v:0 -map "0:a:0?" \
                -vf "scale=w='\''if(gte(iw,ih),-2,min(720,iw))'\'':h='\''if(gte(iw,ih),min(720,ih),-2)'\'',format=yuv420p" \
                -c:v libx264 -preset veryfast -crf 23 -maxrate 3500k -bufsize 7000k \
                -c:a aac -b:a 128k -ac 2 -movflags +faststart -y lite.mp4
              MID=$(awk -v d="$DUR" "BEGIN{printf \"%.2f\", (d>0?d*0.5:1)}")
              ffmpeg -hide_banner -loglevel error -ss "$MID" -i lite.mp4 -vf "thumbnail=120,scale=640:-2" -frames:v 1 -q:v 4 -y thumb.jpg || true
              curl -sf -X POST "$BASE/start?$Q" -H "Content-Type: application/json" -d "{\"w\":$W,\"h\":$H,\"duration\":${DUR:-0}}" -o /dev/null
              split -b 30m -d -a 4 lite.mp4 part_
              PARTS="[]"; N=0
              for f in part_*; do
                N=$((N+1)); R=""
                for try in 1 2 3 4 5; do
                  R=$(curl -sf -X PUT --data-binary @"$f" "$BASE/part?$Q&n=$N") && break
                  echo "part $N retry $try"; sleep $((try*5)); R=""
                done
                [ -n "$R" ]
                PARTS=$(jq -c --argjson p "$R" ". + [\$p]" <<<"$PARTS")
              done
              SIZE=$(stat -c %s lite.mp4)
              curl -sf -X POST "$BASE/done?$Q" -H "Content-Type: application/json" -d "{\"parts\":$PARTS,\"size\":$SIZE}" -o /dev/null
              if [ -s thumb.jpg ]; then curl -sf -X PUT --data-binary @thumb.jpg "$BASE/thumb?$Q" -o /dev/null || true; fi
              echo "Done: $N parts, $SIZE bytes"
            '; then
              echo "Failed: $NAME"; curl -s -X POST "$BASE/fail?$Q" -o /dev/null || true
            fi
          done
        shell: bash
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          LAST=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/commits?per_page=1" | jq -r '.[0].commit.committer.date' || echo "")
          AGE=$(( $(date +%s) - $(date -d "${LAST:-1970-01-01}" +%s) ))
          if [ "$AGE" -gt 2592000 ]; then
            git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" repo && cd repo
            date -u +%F > .keepalive && git add .keepalive
            git -c user.name="light-copy" -c user.email="actions@users.noreply.github.com" commit -qm "keep schedule alive" && git push -q
          fi
